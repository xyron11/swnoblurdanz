<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Preset - DanzClean</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .sp-page {
            --blue-1: #cfdcff;
            --blue-2: #5b86ff;
            --blue-3: #2b4fd6;
            --ink: #070a13;
            --panel: rgba(15, 21, 50, 0.72);
            --panel-solid: #0d1331;
            --line: rgba(255, 255, 255, 0.08);
            --muted: #9ea7d6;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 104px 16px 40px;
            position: relative;
            z-index: 1;
            text-align: left;
        }

        .sp-page *,
        .sp-page *::before,
        .sp-page *::after {
            user-select: text;
            -webkit-user-select: text;
        }

        :where(.sp-page) button,
        :where(.sp-page) input {
            all: unset;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :where(.sp-page) button {
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        :where(.sp-page) button:hover,
        :where(.sp-page) button:active {
            transform: none;
            box-shadow: none;
            filter: none;
        }

        :where(.sp-page) input:focus {
            box-shadow: none;
            background: none;
            border-color: transparent;
        }

        .sp-page a {
            color: inherit;
            text-decoration: none;
        }

        .sp-page a:focus-visible,
        .sp-page button:focus-visible {
            outline: 2px solid var(--blue-2);
            outline-offset: 3px;
        }

        .sp-page input,
        .sp-page input:focus,
        .sp-page input:focus-visible {
            outline: none;
            box-shadow: none;
            border: 0;
            background: transparent;
        }

        .sp-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(520px 320px at 85% 6%, rgba(61, 108, 255, 0.10), transparent 70%),
                radial-gradient(480px 360px at 5% 30%, rgba(61, 108, 255, 0.12), transparent 70%);
        }

        .sp-hero {
            padding: 6px 4px 22px;
        }

        .sp-hero h1 {
            font-size: clamp(30px, 9.4vw, 42px);
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #fff;
            max-width: 12ch;
        }

        .sp-hero p {
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.65;
            color: var(--muted);
            max-width: 38ch;
        }

        .sp-search {
            position: relative;
            padding: 14px;
            border-radius: 26px;
            background:
                linear-gradient(var(--panel-solid), var(--panel-solid)) padding-box,
                linear-gradient(140deg, rgba(150, 180, 255, 0.55), rgba(61, 108, 255, 0.08) 38%, rgba(61, 108, 255, 0.4)) border-box;
            border: 1px solid transparent;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        .sp-field {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 58px;
            padding: 0 8px 0 16px;
            border-radius: 18px;
            background: rgba(4, 7, 24, 0.72);
            border: 1px solid var(--line);
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .sp-field:focus-within {
            border-color: rgba(61, 108, 255, 0.7);
            box-shadow: 0 0 0 4px rgba(61, 108, 255, 0.12);
        }

        .sp-field.sp-bad {
            border-color: rgba(255, 99, 99, 0.75);
            box-shadow: 0 0 0 4px rgba(255, 99, 99, 0.12);
        }

        .sp-field-ico {
            display: flex;
            color: var(--blue-2);
            flex-shrink: 0;
        }

        .sp-field input {
            display: block;
            flex: 1;
            min-width: 0;
            height: 100%;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            caret-color: var(--blue-2);
            text-overflow: ellipsis;
        }

        .sp-field input::placeholder {
            color: rgba(158, 167, 214, 0.6);
        }

        .sp-mini {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            transition: background .2s ease, color .2s ease, transform .15s ease;
        }

        .sp-mini:hover {
            background: rgba(255, 255, 255, 0.09);
            color: #fff;
        }

        .sp-mini:active {
            transform: scale(0.92);
        }

        .sp-mini[hidden] {
            display: none;
        }

        .sp-submit {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 54px;
            margin-top: 12px;
            overflow: hidden;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #5a85ff, #3d6cff 50%, #2b4fd6);
            box-shadow: 0 10px 28px rgba(61, 108, 255, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: transform .15s ease, filter .2s ease;
        }

        .sp-submit:hover {
            filter: brightness(1.08);
            box-shadow: 0 10px 28px rgba(61, 108, 255, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .sp-submit:active {
            transform: scale(0.98);
        }

        .sp-submit[disabled] {
            cursor: progress;
            filter: saturate(0.7) brightness(0.9);
        }

        .sp-spin {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            display: none;
            animation: spSpin .8s linear infinite;
        }

        .sp-submit[disabled] .sp-spin {
            display: block;
        }

        .sp-hint {
            margin: 12px 4px 0;
            font-size: 12px;
            line-height: 1.5;
            color: var(--muted);
        }

        .sp-result {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sp-card {
            padding: 16px;
            border-radius: 22px;
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .sp-banner {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            border-radius: 22px;
            border: 1px solid var(--line);
            background: var(--panel);
        }

        .sp-banner.sp-ok {
            border-color: rgba(61, 108, 255, 0.35);
            background: linear-gradient(110deg, rgba(61, 108, 255, 0.16), rgba(15, 21, 50, 0.72) 70%);
            animation: spRise .55s cubic-bezier(.2, .8, .2, 1) both;
        }

        .sp-banner-ico {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            flex-shrink: 0;
            color: #ffffff;
            background: linear-gradient(135deg, #6c97ff, #3d6cff 60%, #2b4fd6);
        }

        .sp-banner:not(.sp-ok) .sp-banner-ico {
            color: var(--muted);
            background: rgba(255, 255, 255, 0.06);
        }

        .sp-banner.sp-err .sp-banner-ico {
            color: #ff8a8a;
            background: rgba(255, 99, 99, 0.12);
        }

        .sp-banner h2 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }

        .sp-banner p {
            margin-top: 3px;
            font-size: 12.5px;
            line-height: 1.55;
            color: var(--muted);
        }

        .sp-pass {
            position: relative;
            display: flex;
            gap: 14px;
            padding: 14px;
            border-radius: 24px;
            background:
                linear-gradient(160deg, #141b44, #0b1030) padding-box,
                linear-gradient(135deg, rgba(150, 180, 255, 0.85), rgba(61, 108, 255, 0.2) 35%, rgba(61, 108, 255, 0.45)) border-box;
            border: 1px solid transparent;
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(61, 108, 255, 0.08);
        }

        .sp-thumb {
            position: relative;
            width: 92px;
            aspect-ratio: 9 / 16;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            align-self: flex-start;
            background: linear-gradient(160deg, #1b2560, #0d1331);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .sp-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sp-thumb-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(61, 108, 255, 0.7);
        }

        .sp-pass-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .sp-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .sp-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 24px;
            padding: 0 9px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.06);
            white-space: nowrap;
        }

        .sp-badge.sp-type {
            color: #ffffff;
            background: linear-gradient(135deg, var(--blue-2), var(--blue-3));
        }

        .sp-badge.sp-verified {
            color: #a9c0ff;
            background: rgba(61, 108, 255, 0.18);
        }

        .sp-pass h3 {
            margin-top: 10px;
            font-size: 16px;
            line-height: 1.35;
            font-weight: 700;
            color: #fff;
            overflow-wrap: anywhere;
        }

        .sp-pass small {
            display: block;
            margin-top: 3px;
            font-size: 12px;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .sp-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 14px;
        }

        .sp-open {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            height: 44px;
            padding: 0 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #5a85ff, #3d6cff 55%, #2b4fd6);
            box-shadow: 0 8px 22px rgba(61, 108, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: transform .15s ease, filter .2s ease;
        }

        .sp-open:hover {
            filter: brightness(1.06);
            box-shadow: 0 8px 22px rgba(61, 108, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .sp-open:active {
            transform: scale(0.97);
        }

        .sp-copy {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            flex-shrink: 0;
            color: var(--blue-1);
            background: rgba(61, 108, 255, 0.1);
            box-shadow: inset 0 0 0 1px rgba(61, 108, 255, 0.3);
            transition: transform .15s ease, background .2s ease;
        }

        .sp-copy:hover {
            background: rgba(61, 108, 255, 0.18);
            box-shadow: inset 0 0 0 1px rgba(61, 108, 255, 0.3);
        }

        .sp-copy:active {
            transform: scale(0.92);
        }

        .sp-video-top {
            display: flex;
            gap: 14px;
        }

        .sp-cover {
            width: 76px;
            aspect-ratio: 9 / 16;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(160deg, #1b2560, #0d1331);
            position: relative;
        }

        .sp-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sp-author {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .sp-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, #7fa2ff, #3d6cff);
            box-shadow: 0 0 0 2px rgba(61, 108, 255, 0.5);
        }

        .sp-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sp-author b {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sp-author span {
            display: block;
            font-size: 12px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sp-desc {
            margin-top: 10px;
            font-size: 12.5px;
            line-height: 1.6;
            color: #cfd6f6;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        .sp-date {
            margin-top: 8px;
            font-size: 11.5px;
            color: var(--muted);
        }

        .sp-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 14px;
        }

        .sp-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 4px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--muted);
            font-size: 10.5px;
        }

        .sp-stat b {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .sp-links {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .sp-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            height: 42px;
            padding: 0 10px;
            border-radius: 13px;
            font-size: 12.5px;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 0 1px var(--line);
            transition: background .2s ease, transform .15s ease;
        }

        .sp-link-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sp-link-btn:active {
            transform: scale(0.97);
        }

        .sp-sec-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .sp-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .sp-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 11px;
            border-radius: 99px;
            font-size: 11.5px;
            font-weight: 500;
            color: #cfd6f6;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 0 1px var(--line);
        }

        .sp-chip svg {
            color: #7fa2ff;
        }

        .sp-chip.sp-off svg {
            color: rgba(158, 167, 214, 0.5);
        }

        .sp-other {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            transition: background .2s ease;
        }

        .sp-other + .sp-other {
            margin-top: 8px;
        }

        .sp-other:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .sp-other-ico {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 11px;
            color: var(--blue-1);
            background: rgba(61, 108, 255, 0.1);
            flex-shrink: 0;
        }

        .sp-other-txt {
            flex: 1;
            min-width: 0;
        }

        .sp-other-txt b {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }

        .sp-other-txt span {
            display: block;
            font-size: 11.5px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sp-skel {
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
        }

        .sp-skel::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(61, 108, 255, 0.14), transparent);
            animation: spSweep 1.5s ease-in-out infinite;
        }

        .sp-load-line {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
            font-size: 13px;
            font-weight: 500;
            color: var(--blue-1);
        }

        .sp-load-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--blue-2);
            box-shadow: 0 0 0 0 rgba(61, 108, 255, 0.6);
            animation: spPulse 1.4s ease-out infinite;
        }

        .sp-toast {
            position: fixed;
            left: 50%;
            bottom: calc(120px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 16px);
            padding: 11px 18px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #5a85ff, #3d6cff);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .3s cubic-bezier(.34, 1.4, .5, 1);
            z-index: 7650;
            white-space: nowrap;
        }

        .sp-toast.sp-show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .sp-rise {
            animation: spRise .55s cubic-bezier(.2, .8, .2, 1) both;
        }

        @keyframes spRise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spSweep {
            to {
                transform: translateX(100%);
            }
        }

        @keyframes spPulse {
            70% {
                box-shadow: 0 0 0 10px rgba(61, 108, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(61, 108, 255, 0);
            }
        }

        @media (max-width: 380px) {
            .sp-thumb {
                width: 78px;
            }

            .sp-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .sp-rise,
            .sp-banner.sp-ok,
            .sp-skel::after,
            .sp-load-dot {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="topbar"></div>
    <script src="config.js"></script>
    <script src="Akun.js"></script>
    <script src="sidebar.js"></script>

    <div class="sp-glow"></div>

    <main class="sp-page">
        <header class="sp-hero">
            <h1>Cari preset dari link TikTok</h1>
            <p>Tempel link video, kami pindai deskripsi, bio, dan komentar untuk menemukan link preset Alight Motion-nya.</p>
        </header>

        <section class="sp-search">
            <form id="spForm" novalidate>
                <label class="sp-field" id="spField">
                    <span class="sp-field-ico">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.43"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.33-1.33"/></svg>
                    </span>
                    <input id="spInput" type="url" inputmode="url" placeholder="Tempel link TikTok di sini" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Link TikTok">
                    <button type="button" class="sp-mini" id="spClear" aria-label="Hapus link" hidden>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    </button>
                    <button type="button" class="sp-mini" id="spPaste" aria-label="Tempel dari clipboard">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
                    </button>
                </label>
                <button type="submit" class="sp-submit" id="spSubmit">
                    <span class="sp-spin"></span>
                    <span id="spSubmitLabel">Cari preset</span>
                </button>
            </form>
            <p class="sp-hint" id="spHint">Bisa pakai link vt.tiktok.com, vm.tiktok.com, atau tiktok.com.</p>
        </section>

        <section class="sp-result" id="spResult" aria-live="polite"></section>
    </main>

    <div class="sp-toast" id="spToast"></div>

    <script>
        (function () {
            const API_BASE = typeof PRESET_SEARCH_API === "undefined" ? "" : PRESET_SEARCH_API;

            const ICONS = {
                spark: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>',
                empty: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M8.5 11h5"/></svg>',
                warn: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>',
                check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
                cross: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>',
                shield: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>',
                user: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>',
                open: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
                copy: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
                eye: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
                heart: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9.3-9.2A5 5 0 0 1 12 6.6a5 5 0 0 1 9.3 4.2C19.5 15.4 12 20 12 20z"/></svg>',
                chat: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
                share: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>',
                video: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="2.5"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
                download: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 11 12 15.5 16.5 11"/><path d="M5 20h14"/></svg>',
                globe: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg>',
                wa: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.9 7L4 20l1.1-4A8 8 0 1 1 20 12z"/><path d="M9 9.5c.3 2.2 2.6 4.4 5 5l1.2-1.2-1.8-1-.8.7c-.8-.3-1.6-1.1-2-2l.7-.8-1-1.8z"/></svg>',
                link: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.43"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.33-1.33"/></svg>',
                film: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>'
            };

            const SOURCE_LABEL = { comment: "Komentar", description: "Deskripsi", bio: "Bio", bioLink: "Link bio" };

            const form = document.getElementById("spForm");
            const field = document.getElementById("spField");
            const input = document.getElementById("spInput");
            const clearBtn = document.getElementById("spClear");
            const pasteBtn = document.getElementById("spPaste");
            const submitBtn = document.getElementById("spSubmit");
            const submitLabel = document.getElementById("spSubmitLabel");
            const hint = document.getElementById("spHint");
            const result = document.getElementById("spResult");
            const toastEl = document.getElementById("spToast");

            let busy = false;
            let loadTimer = null;
            let toastTimer = null;
            let controller = null;

            function el(tag, cls, text) {
                const e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text !== undefined && text !== null) e.textContent = text;
                return e;
            }

            function icon(name) {
                const s = document.createElement("span");
                s.style.display = "inline-flex";
                s.innerHTML = ICONS[name] || "";
                return s;
            }

            function safeUrl(u) {
                try {
                    const x = new URL(u);
                    return x.protocol === "https:" || x.protocol === "http:" ? x.href : null;
                } catch (e) {
                    return null;
                }
            }

            function isTiktok(u) {
                try {
                    return /(^|\.)tiktok\.com$/i.test(new URL(u).hostname);
                } catch (e) {
                    return false;
                }
            }

            function normalize(v) {
                v = (v || "").trim();
                if (!v) return "";
                if (!/^https?:\/\//i.test(v)) v = "https://" + v;
                return v;
            }

            function compact(n) {
                return new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(Number(n) || 0);
            }

            function formatDate(sec) {
                const n = Number(sec);
                if (!n) return "";
                return new Date(n * 1000).toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
            }

            function toast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add("sp-show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove("sp-show"), 1800);
            }

            async function copyText(text) {
                try {
                    await navigator.clipboard.writeText(text);
                } catch (e) {
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    ta.style.position = "fixed";
                    ta.style.opacity = "0";
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand("copy"); } catch (e2) {}
                    ta.remove();
                }
                toast("Link tersalin");
            }

            function imgWithFallback(wrapper, src, fallbackName) {
                const safe = safeUrl(src);
                const fb = el("span", "sp-thumb-fallback");
                fb.appendChild(icon(fallbackName || "film"));
                wrapper.appendChild(fb);
                if (!safe) return;
                const im = document.createElement("img");
                im.alt = "";
                im.loading = "lazy";
                im.referrerPolicy = "no-referrer";
                im.addEventListener("load", () => fb.remove());
                im.addEventListener("error", () => im.remove());
                im.src = safe;
                wrapper.appendChild(im);
            }

            function banner(kind, iconName, title, text) {
                const b = el("div", "sp-banner" + (kind ? " " + kind : ""));
                const ic = el("div", "sp-banner-ico");
                ic.appendChild(icon(iconName));
                const body = el("div");
                body.appendChild(el("h2", "", title));
                if (text) body.appendChild(el("p", "", text));
                b.appendChild(ic);
                b.appendChild(body);
                return b;
            }

            function setBusy(v) {
                busy = v;
                submitBtn.disabled = v;
                submitLabel.textContent = v ? "Mencari…" : "Cari preset";
            }

            function showLoading() {
                result.replaceChildren();
                const line = el("div", "sp-load-line");
                line.appendChild(el("span", "sp-load-dot"));
                const msg = el("span", "", "Membaca deskripsi video…");
                line.appendChild(msg);
                result.appendChild(line);

                const card = el("div", "sp-card");
                const row = el("div", "sp-video-top");
                const th = el("div", "sp-skel");
                th.style.cssText = "width:92px;aspect-ratio:9/16;border-radius:16px;flex-shrink:0";
                const col = el("div");
                col.style.cssText = "flex:1;display:flex;flex-direction:column;gap:10px";
                [["70%", 18], ["100%", 12], ["90%", 12], ["55%", 12]].forEach(s => {
                    const sk = el("div", "sp-skel");
                    sk.style.cssText = "width:" + s[0] + ";height:" + s[1] + "px";
                    col.appendChild(sk);
                });
                const btn = el("div", "sp-skel");
                btn.style.cssText = "height:44px;margin-top:auto";
                col.appendChild(btn);
                row.appendChild(th);
                row.appendChild(col);
                card.appendChild(row);
                result.appendChild(card);

                const steps = ["Membaca deskripsi video…", "Memindai bio kreator…", "Menelusuri komentar…", "Memverifikasi link preset…"];
                let i = 0;
                clearInterval(loadTimer);
                loadTimer = setInterval(() => {
                    i = (i + 1) % steps.length;
                    msg.textContent = steps[i];
                }, 2200);
            }

            function stopLoading() {
                clearInterval(loadTimer);
                loadTimer = null;
            }

            function showError(title, text) {
                stopLoading();
                result.replaceChildren();
                const b = banner("sp-err", "warn", title, text);
                b.classList.add("sp-rise");
                result.appendChild(b);
            }

            function presetCard(p, index) {
                const card = el("article", "sp-pass sp-rise");
                card.style.animationDelay = (0.08 + index * 0.1) + "s";

                const thumb = el("div", "sp-thumb");
                const thumbSrc = (p.thumbs && (p.thumbs[1] || p.thumbs[0])) || p.thumb;
                imgWithFallback(thumb, thumbSrc, "film");
                card.appendChild(thumb);

                const body = el("div", "sp-pass-body");
                const badges = el("div", "sp-badges");
                if (p.type) {
                    const t = el("span", "sp-badge sp-type");
                    t.textContent = String(p.type).toUpperCase();
                    badges.appendChild(t);
                }
                if (p.verified) {
                    const v = el("span", "sp-badge sp-verified");
                    v.appendChild(icon("shield"));
                    v.appendChild(document.createTextNode("Terverifikasi"));
                    badges.appendChild(v);
                }
                if (p.byAuthor) {
                    const a = el("span", "sp-badge");
                    a.appendChild(icon("user"));
                    a.appendChild(document.createTextNode("Dari kreator"));
                    badges.appendChild(a);
                }
                body.appendChild(badges);

                body.appendChild(el("h3", "", p.title || "Preset Alight Motion"));
                const from = (SOURCE_LABEL[p.source] || "Ditemukan") + (p.detail ? " · " + p.detail : "");
                body.appendChild(el("small", "", from));

                const actions = el("div", "sp-actions");
                const safe = safeUrl(p.url);
                if (safe) {
                    const open = el("a", "sp-open");
                    open.href = safe;
                    open.target = "_blank";
                    open.rel = "noopener noreferrer";
                    open.appendChild(el("span", "", "Buka preset"));
                    open.appendChild(icon("open"));
                    actions.appendChild(open);

                    const copy = el("button", "sp-copy");
                    copy.type = "button";
                    copy.setAttribute("aria-label", "Salin link preset");
                    copy.appendChild(icon("copy"));
                    copy.addEventListener("click", () => copyText(safe));
                    actions.appendChild(copy);
                }
                body.appendChild(actions);
                card.appendChild(body);
                return card;
            }

            function videoCard(r) {
                const v = r.video || {};
                const ad = r.authorDetail || {};
                const card = el("section", "sp-card sp-rise");
                card.style.animationDelay = ".2s";

                const top = el("div", "sp-video-top");
                const cover = el("div", "sp-cover");
                imgWithFallback(cover, v.cover, "film");
                top.appendChild(cover);

                const info = el("div");
                info.style.cssText = "flex:1;min-width:0";
                const author = el("div", "sp-author");
                const av = el("div", "sp-avatar");
                const avSafe = safeUrl(ad.avatar);
                if (avSafe) {
                    const im = document.createElement("img");
                    im.alt = "";
                    im.referrerPolicy = "no-referrer";
                    im.addEventListener("error", () => im.remove());
                    im.src = avSafe;
                    av.appendChild(im);
                }
                author.appendChild(av);
                const names = el("div");
                names.style.minWidth = "0";
                names.appendChild(el("b", "", ad.nickname || r.author || "Kreator"));
                names.appendChild(el("span", "", r.author || (ad.uniqueId ? "@" + ad.uniqueId : "")));
                author.appendChild(names);
                info.appendChild(author);
                if (v.description) info.appendChild(el("p", "sp-desc", v.description));
                const d = formatDate(v.createTime);
                if (d) info.appendChild(el("p", "sp-date", "Diunggah " + d));
                top.appendChild(info);
                card.appendChild(top);

                const st = v.stats || {};
                const stats = el("div", "sp-stats");
                [["eye", st.views, "Tayangan"], ["heart", st.likes, "Suka"], ["chat", st.comments, "Komentar"], ["share", st.shares, "Dibagikan"]].forEach(s => {
                    const box = el("div", "sp-stat");
                    box.appendChild(icon(s[0]));
                    box.appendChild(el("b", "", compact(s[1])));
                    box.appendChild(el("span", "", s[2]));
                    stats.appendChild(box);
                });
                card.appendChild(stats);

                const links = el("div", "sp-links");
                const pageUrl = safeUrl(v.url || r.videoUrl);
                if (pageUrl) {
                    const a = el("a", "sp-link-btn");
                    a.href = pageUrl;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.appendChild(icon("video"));
                    a.appendChild(el("span", "", "Buka di TikTok"));
                    links.appendChild(a);
                }
                if (links.children.length) card.appendChild(links);
                return card;
            }

            function otherLinksCard(list) {
                const clean = (list || []).filter(o => {
                    const u = safeUrl(o.url);
                    if (!u) return false;
                    return !/(tiktok[vw]\.|byte|ibyte|musical\.ly)/i.test(new URL(u).hostname);
                });
                if (!clean.length) return null;
                const card = el("section", "sp-card sp-rise");
                card.style.animationDelay = ".3s";
                card.appendChild(el("div", "sp-sec-title", "Link lain yang ditemukan"));
                clean.forEach(o => {
                    const u = safeUrl(o.url);
                    const host = new URL(u).hostname.replace(/^www\./, "");
                    let name = host;
                    let ic = "globe";
                    if (/whatsapp\.com/i.test(host)) { name = "Channel WhatsApp"; ic = "wa"; }
                    else if (/linktr\.ee/i.test(host)) { name = "Linktree"; ic = "link"; }
                    const a = el("a", "sp-other");
                    a.href = u;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    const ico = el("span", "sp-other-ico");
                    ico.appendChild(icon(ic));
                    const txt = el("div", "sp-other-txt");
                    txt.appendChild(el("b", "", name));
                    txt.appendChild(el("span", "", (SOURCE_LABEL[o.source] || "Lainnya") + (o.detail ? " · " + o.detail : "")));
                    a.appendChild(ico);
                    a.appendChild(txt);
                    a.appendChild(icon("open"));
                    card.appendChild(a);
                });
                return card;
            }

            function scanCard(r) {
                const s = r.scanned || {};
                const ctx = r.context || {};
                const card = el("section", "sp-card sp-rise");
                card.style.animationDelay = ".36s";
                card.appendChild(el("div", "sp-sec-title", "Yang sudah dipindai"));
                const chips = el("div", "sp-chips");
                const items = [
                    ["Deskripsi", !!s.description],
                    ["Bio kreator", !!s.bio],
                    ["Halaman link bio", !!s.bioLinkPage],
                    [(s.comments || 0) + " komentar", (s.comments || 0) > 0],
                    [(s.replies || 0) + " balasan", (s.replies || 0) > 0]
                ];
                items.forEach(it => {
                    const c = el("span", "sp-chip" + (it[1] ? "" : " sp-off"));
                    c.appendChild(icon(it[1] ? "check" : "cross"));
                    c.appendChild(document.createTextNode(it[0]));
                    chips.appendChild(c);
                });
                card.appendChild(chips);
                if (ctx.matched && ctx.matched.length) {
                    const wrap = el("div", "sp-chips");
                    wrap.style.marginTop = "12px";
                    ctx.matched.slice(0, 8).forEach(m => {
                        const c = el("span", "sp-chip", "#" + m);
                        wrap.appendChild(c);
                    });
                    card.appendChild(wrap);
                }
                return card;
            }

            function render(r) {
                stopLoading();
                result.replaceChildren();
                const presets = Array.isArray(r.presetLinks) ? r.presetLinks : [];

                if (r.found && presets.length) {
                    const n = presets.length;
                    result.appendChild(banner("sp-ok", "spark", n === 1 ? "Preset ditemukan" : n + " preset ditemukan", n === 1 ? "Link preset terdeteksi dari video ini." : "Link preset terdeteksi dari video ini."));
                    presets.forEach((p, i) => result.appendChild(presetCard(p, i)));
                } else {
                    const b = banner("", "empty", "Belum ada preset di video ini", "Tidak ada link preset di deskripsi, bio, maupun komentar. Coba video lain dari kreator yang sama.");
                    b.classList.add("sp-rise");
                    result.appendChild(b);
                }

                if (r.video || r.authorDetail) result.appendChild(videoCard(r));
                const other = otherLinksCard(r.otherLinks);
                if (other) result.appendChild(other);
                if (r.scanned) result.appendChild(scanCard(r));
            }

            async function search(raw) {
                if (busy) return;
                const url = normalize(raw);
                input.value = url;
                clearBtn.hidden = !url;

                if (!url || !isTiktok(url)) {
                    field.classList.add("sp-bad");
                    hint.textContent = "Link belum benar. Tempel link video TikTok, contoh: https://vt.tiktok.com/xxxx";
                    input.focus();
                    return;
                }
                field.classList.remove("sp-bad");
                hint.textContent = "Bisa pakai link vt.tiktok.com, vm.tiktok.com, atau tiktok.com.";

                if (!API_BASE) {
                    showError("API belum diatur", "Tambahkan PRESET_SEARCH_API di config.js, lalu muat ulang halaman.");
                    return;
                }

                setBusy(true);
                showLoading();
                result.scrollIntoView({ behavior: "smooth", block: "start" });

                if (controller) controller.abort();
                controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 90000);

                try {
                    const res = await fetch(API_BASE + "?url=" + encodeURIComponent(url), { signal: controller.signal, headers: { Accept: "application/json" } });
                    let json = null;
                    try { json = await res.json(); } catch (e) {}
                    const r = json && json.result;
                    if (!res.ok || !json || json.status === false || !r || r.ok === false) {
                        const msg = (json && (json.message || json.error)) || (r && (r.message || r.error));
                        showError("Pencarian gagal", msg ? String(msg) : "Server tidak memberi hasil. Cek linknya, lalu coba lagi.");
                    } else {
                        render(r);
                        try { history.replaceState(null, "", "?url=" + encodeURIComponent(url)); } catch (e) {}
                    }
                } catch (e) {
                    if (e && e.name === "AbortError") {
                        showError("Terlalu lama", "Server belum menjawab. Coba lagi beberapa saat lagi.");
                    } else {
                        showError("Tidak bisa terhubung", "Periksa koneksi internet, lalu coba lagi.");
                    }
                } finally {
                    clearTimeout(timeout);
                    setBusy(false);
                }
            }

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                search(input.value);
            });

            input.addEventListener("input", () => {
                clearBtn.hidden = !input.value;
                field.classList.remove("sp-bad");
            });

            clearBtn.addEventListener("click", () => {
                input.value = "";
                clearBtn.hidden = true;
                field.classList.remove("sp-bad");
                input.focus();
            });

            pasteBtn.addEventListener("click", async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (!text) {
                        toast("Clipboard kosong");
                        return;
                    }
                    input.value = text.trim();
                    clearBtn.hidden = !input.value;
                    field.classList.remove("sp-bad");
                    search(input.value);
                } catch (e) {
                    toast("Izin clipboard ditolak, tempel manual");
                    input.focus();
                }
            });

            const params = new URLSearchParams(location.search);
            const deep = params.get("url");
            if (deep) {
                input.value = deep;
                clearBtn.hidden = false;
                search(deep);
            }
        })();
    </script>

</body>
