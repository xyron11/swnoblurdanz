<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - DanzClean</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="topbar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </div>

<div class="sidebar" id="sidebar"></div>
<script src="sidebar.js"></script>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="container" style="padding: 20px; max-width: 600px; margin: 70px auto 0 auto;">
        <div style="text-align: center;">
            <h2 style="color: #fff; font-size: 22px; margin-bottom: 20px;">TikTok Downloader</h2>
            
            <input type="text" id="ttUrlInput" placeholder="Masukkan Link TikTok..." style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #0c102b; color: #fff; margin-bottom: 15px; box-sizing: border-box; font-size: 14px;">
            
            <button onclick="processTikTokDownload()" style="width: 100%; padding: 14px; border-radius: 12px; border: none; background: #00e676; color: #000; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 0 15px rgba(0,230,118,0.4);">
                CARI MEDIA
            </button>
            
            <div id="ttResult" style="margin-top: 25px;"></div>
        </div>
    </div>

    <div class="custom-popup" id="customPopup">
        <div class="custom-popup-card">
            <div class="custom-popup-text" id="customPopupText"></div>
            <button class="custom-popup-btn" onclick="closeCustomPopup()">OK</button>
        </div>
    </div>

    <script>
        function showCustomPopup(message) {
            document.getElementById("customPopupText").innerText = message;
            document.getElementById("customPopup").classList.add("show");
        }

        function closeCustomPopup() {
            document.getElementById("customPopup").classList.remove("show");
        }
        function toggleMenu(){
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function extractFilename(url) {
            try {
                return new URL(url).searchParams.get('n') || 'danzclean_file';
            } catch {
                return 'danzclean_file';
            }
        }


        function forceDownload(fileUrl, fileName, btnElement) {
            if (!fileName) fileName = extractFilename(fileUrl);
            const originalText = btnElement.innerText;
            btnElement.innerText = "Membuka unduhan...";
            btnElement.style.opacity = "0.7";

            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = fileUrl;
            a.download = fileName;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                btnElement.innerText = originalText;
                btnElement.style.opacity = "1";
            }, 1200);
        }

        function isValidTikTokUrl(url) {
            return /tiktok\.com|vt\.tiktok|vm\.tiktok/i.test(url);
        }

        async function processTikTokDownload() {
            const url = document.getElementById("ttUrlInput").value.trim();
            const resultDiv = document.getElementById("ttResult");
            
            if (!url) {
                alert("Masukkan URL TikTok terlebih dahulu!");
                return;
            }

            if (!isValidTikTokUrl(url)) {
                showCustomPopup("Itu bukan link TikTok!");
                return;
            }

            resultDiv.innerHTML = '<p style="color: #aaa; text-align: center;">Mengambil data media...</p>';

            try {
                const targetApi = `${DOWNLOAD_API}/api/tiktok?url=${encodeURIComponent(url)}`;
                const response = await fetch(targetApi);
                const data = await response.json();

                if (!data.status || !data.result) {
                    resultDiv.innerHTML = `<p style="color: #ff5252; text-align: center;">Gagal mengambil data dari URL tersebut.<br><span style="font-size:11px; opacity:0.8;">${data.error || data.message || ''}</span></p>`;
                    return;
                }

                const res = data.result;
                let mediaHtml = '';

                if (res.images && res.images.length > 0) {
                    mediaHtml += `<div style="display:flex; overflow-x:auto; gap:10px; margin-bottom:15px; padding-bottom:5px;">`;
                    res.images.forEach((img, idx) => {
                        mediaHtml += `
                            <div style="flex:0 0 auto; text-align:center;">
                                <img src="${img}" style="height:200px; border-radius:10px; display:block; margin-bottom:8px;">
                                <button onclick="forceDownload('${img}', null, this)" style="background:#00e676; color:#000; padding:8px 12px; border-radius:6px; border:none; font-weight:bold; font-size:11px; cursor:pointer;">DOWNLOAD FOTO ${idx+1}</button>
                            </div>
                        `;
                    });
                    mediaHtml += `</div>`;
                } else if (res.url) {
                    mediaHtml += `<video src="${res.url}" controls poster="${res.cover || ''}" style="width:100%; border-radius:12px; max-height:350px; margin-bottom:12px;"></video>`;
                }

                resultDiv.innerHTML = `
                    <div style="background: rgba(12, 16, 43, 0.9); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 16px; text-align: center;">
                        <p style="color: #fff; font-size: 13px; margin-bottom: 12px; line-height: 1.4;">${res.title || 'TikTok Media'}</p>
                        ${mediaHtml}
                        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                            ${res.url && (!res.images || res.images.length === 0) ? `<button onclick="forceDownload('${res.url}', null, this)" style="background:#00e676; color:#000; padding:12px; border-radius:10px; border:none; font-weight:bold; cursor:pointer;">DOWNLOAD VIDEO</button>` : ''}
                            ${res.audio ? `<button onclick="forceDownload('${res.audio}', null, this)" style="background:#e91e63; color:#fff; padding:12px; border-radius:10px; border:none; font-weight:bold; cursor:pointer;">DOWNLOAD AUDIO (MP3)</button>` : ''}
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error(e);
                resultDiv.innerHTML = `<p style="color: #ff5252; text-align: center;">Terjadi kesalahan koneksi.<br><span style="font-size:11px; opacity:0.8;">${e.message}</span></p>`;
            }
        }
    </script>
</body>
</html>
