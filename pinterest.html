<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Downloader - DanzClean</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="topbar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </div>

    <div class="sidebar" id="sidebar"></div>
    <script src="sidebar.js"></script>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="container" style="padding: 20px; max-width: 600px; margin: 70px auto 0 auto;">
        <div style="text-align: center;">
            <h2 style="color: #fff; font-size: 22px; margin-bottom: 20px;">Pinterest Downloader</h2>

            <input type="text" id="pinUrlInput" placeholder="Masukkan Link Pinterest..." style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #0c102b; color: #fff; margin-bottom: 15px; box-sizing: border-box; font-size: 14px;">

            <button onclick="processPinterestSearch()" style="width: 100%; padding: 14px; border-radius: 12px; border: none; background: #00e676; color: #000; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 0 15px rgba(0,230,118,0.4);">
                CARI MEDIA
            </button>

            <div id="pinResult" style="margin-top: 25px;"></div>
        </div>
    </div>

    <div class="custom-popup" id="customPopup">
        <div class="custom-popup-card">
            <div class="custom-popup-text" id="customPopupText"></div>
            <button class="custom-popup-btn" onclick="closeCustomPopup()">OK</button>
        </div>
    </div>

    <script>
        let currentPinResult = null;

        function showCustomPopup(message) {
            document.getElementById("customPopupText").innerText = message;
            document.getElementById("customPopup").classList.add("show");
        }

        function closeCustomPopup() {
            document.getElementById("customPopup").classList.remove("show");
        }

        function toggleMenu(){
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function isValidPinterestUrl(url) {
            return /pinterest\.com|pin\.it/i.test(url);
        }

        function getBestImage(images) {
            if (!images || !images.length) return null;
            const orig = images.find(img => img.name === "orig");
            if (orig) return orig;

            let best = images[0];
            let bestArea = (best.width || 0) * (best.height || 0);
            images.forEach(img => {
                const area = (img.width || 0) * (img.height || 0);
                if (area > bestArea) {
                    best = img;
                    bestArea = area;
                }
            });
            return best;
        }

        async function processPinterestSearch() {
            const url = document.getElementById("pinUrlInput").value.trim();
            const resultDiv = document.getElementById("pinResult");

            if (!url) {
                alert("Masukkan URL Pinterest terlebih dahulu!");
                return;
            }

            if (!isValidPinterestUrl(url)) {
                showCustomPopup("Itu bukan link Pinterest!");
                return;
            }

            currentPinResult = null;
            resultDiv.innerHTML = '<p style="color: #aaa; text-align: center;">Mengambil data Pinterest...</p>';

            try {
                const targetApi = `${YT_API}/pinterest?url=${encodeURIComponent(url)}`;
                const response = await fetch(targetApi);
                const data = await response.json();

                if (!data.status || !data.result) {
                    resultDiv.innerHTML = `<p style="color: #ff5252; text-align: center;">Gagal mengambil data dari URL tersebut.<br><span style="font-size:11px; opacity:0.8;">${data.error || data.message || ''}</span></p>`;
                    return;
                }

                const res = data.result;
                currentPinResult = res;

                const isVideo = res.type === "video";
                const videoUrl = isVideo ? (res.download || (res.videos && res.videos[0] && res.videos[0].url)) : null;
                const photoUrl = !isVideo ? (getBestImage(res.images) || {}).url : null;
                const captionText = res.title || (isVideo ? 'Video Pinterest' : 'Gambar Pinterest');

                let mediaHtml = '';
                if (isVideo && videoUrl) {
                    mediaHtml = `
                        <video controls style="width:100%; border-radius:12px; max-height:380px; background:#000; margin-bottom:15px;">
                            <source src="${videoUrl}" type="video/mp4">
                        </video>`;
                } else if (photoUrl) {
                    mediaHtml = `<img src="${photoUrl}" style="width:100%; border-radius:12px; max-height:380px; object-fit:cover; margin-bottom:15px;">`;
                }

                let tutorialHtml = '';
                if (isVideo) {
                    tutorialHtml = `
                        <div style="background: rgba(0, 230, 118, 0.08); border: 1px dashed #00e676; padding: 14px; border-radius: 12px; text-align: left;">
                            <p style="color: #00e676; font-size: 13px; font-weight: bold; margin: 0 0 10px 0; text-align: center;">
                                💡 Cara Menyimpan Video
                            </p>
                            
                            <div style="margin-bottom: 10px;">
                                <span style="background: #00e676; color: #000; font-weight: bold; font-size: 10px; padding: 2px 6px; border-radius: 4px;">TUTORIAL 1</span>
                                <p style="color: #fff; font-size: 11px; margin: 4px 0 0 0; line-height: 1.4;">
                                    Klik ikon <strong>titik tiga (⋮)</strong> di pojok kanan bawah video di atas, lalu pilih <strong>"Download"</strong>.
                                </p>
                            </div>

                            <div style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px;">
                                <span style="background: #00e676; color: #000; font-weight: bold; font-size: 10px; padding: 2px 6px; border-radius: 4px;">TUTORIAL 2</span>
                                <p style="color: #fff; font-size: 11px; margin: 4px 0 0 0; line-height: 1.4;">
                                    <strong>Tekan & tahan lama</strong> pada area video di atas, lalu pilih <strong>"Simpan Video" / "Download Video"</strong>.
                                </p>
                            </div>
                        </div>
                    `;
                } else {
                    tutorialHtml = `
                        <div style="background: rgba(0, 230, 118, 0.08); border: 1px dashed #00e676; padding: 14px; border-radius: 12px; text-align: center;">
                            <p style="color: #00e676; font-size: 13px; font-weight: bold; margin: 0 0 6px 0;">
                                 Cara Menyimpan Foto
                            </p>
                            <p style="color: #fff; font-size: 11px; margin: 0; line-height: 1.4;">
                                <strong>Tekan & tahan lama</strong> gambar di atas, lalu pilih <strong>"Download Gambar"</strong>.
                            </p>
                        </div>
                    `;
                }

                resultDiv.innerHTML = `
                    <div style="background: rgba(12, 16, 43, 0.9); border: 1px solid rgba(0,230,118,0.2); padding: 18px; border-radius: 16px; text-align: center;">
                        <h3 style="color: #fff; font-size: 16px; font-weight: 600; margin: 0 0 4px 0; line-height: 1.4;">${captionText}</h3>
                        <p style="color: #888; font-size: 11px; margin-bottom: 12px;">${res.user && res.user.fullName ? 'By: ' + res.user.fullName : ''}</p>
                        
                        ${mediaHtml}
                        ${tutorialHtml}
                    </div>
                `;
            } catch (e) {
                console.error(e);
                resultDiv.innerHTML = `<p style="color: #ff5252; text-align: center;">Terjadi kesalahan koneksi.<br><span style="font-size:11px; opacity:0.8;">${e.message}</span></p>`;
            }
        }
    </script>
</body>
</html>
