<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Blokir Akun - danzclean</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

<style>
.block-page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:120px 16px 60px;
    box-sizing:border-box;
}
.block-card{
    width:100%;
    max-width:560px;
    padding:28px 24px;
    border-radius:32px;
    background:linear-gradient(145deg, rgba(14,18,45,.94), rgba(6,9,24,.92));
    border:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(16px);
    box-shadow:0 10px 40px rgba(0,0,0,.35), 0 0 40px rgba(76,125,255,.08);
    box-sizing:border-box;
}
.block-card-icon{
    font-size:44px;
    margin-bottom:8px;
    text-align:center;
}
.block-card-title{
    font-size:26px;
    font-weight:800;
    margin-bottom:4px;
    text-align:center;
    background:linear-gradient(135deg, #ffffff, #73a5ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.block-card-desc{
    color:#aeb8e8;
    font-size:13px;
    margin-bottom:20px;
    text-align:center;
}
.block-search{
    width:100%;
    padding:13px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
    color:#fff;
    font-size:14px;
    margin-bottom:14px;
    box-sizing:border-box;
    outline:none;
}
.block-search::placeholder{ color:#7a84ad; }
.block-count{
    color:#7a84ad;
    font-size:12px;
    margin-bottom:14px;
}
.block-list{
    max-height:60vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.block-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px 12px;
    padding:14px;
    border-radius:16px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.05);
}
.block-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(135deg,#4c7dff,#00ffaa);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:#0a0e1a;
    flex-shrink:0;
    font-size:15px;
    overflow:hidden;
}
.block-avatar img{ width:100%; height:100%; object-fit:cover; }
.block-info{
    flex:1 1 140px;
    min-width:0;
}
.block-username{
    color:#fff;
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.block-meta{
    color:#7a84ad;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.block-phone{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:2px;
    flex-wrap:nowrap;
}
.block-phone-text{
    color:#7a84ad;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1 1 auto;
    min-width:0;
}
.block-edit-phone{
    border:none;
    background:rgba(76,125,255,.15);
    color:#73a5ff;
    font-size:11px;
    padding:4px 10px;
    border-radius:8px;
    cursor:pointer;
    flex:0 0 auto;
    width:auto;
    box-shadow:none;
    letter-spacing:normal;
    line-height:1.6;
}
.block-edit-phone:hover{
    background:rgba(76,125,255,.28);
    transform:none;
    box-shadow:none;
    filter:none;
}
.block-password{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:2px;
    flex-wrap:nowrap;
}
.block-password-text{
    color:#7a84ad;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1 1 auto;
    min-width:0;
    font-family:monospace;
    letter-spacing:1px;
}
.block-eye-btn{
    border:none;
    background:rgba(255,255,255,.06);
    color:#aeb8e8;
    font-size:12px;
    padding:4px 8px;
    border-radius:8px;
    cursor:pointer;
    flex:0 0 auto;
    width:auto;
    box-shadow:none;
    letter-spacing:normal;
    line-height:1.6;
}
.block-eye-btn:hover{
    background:rgba(255,255,255,.12);
    transform:none;
    box-shadow:none;
    filter:none;
}
.block-edit-password{
    border:none;
    background:rgba(76,125,255,.15);
    color:#73a5ff;
    font-size:11px;
    padding:4px 10px;
    border-radius:8px;
    cursor:pointer;
    flex:0 0 auto;
    width:auto;
    box-shadow:none;
    letter-spacing:normal;
    line-height:1.6;
}
.block-edit-password:hover{
    background:rgba(76,125,255,.28);
    transform:none;
    box-shadow:none;
    filter:none;
}
.block-tabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
}
.block-tab{
    border:none;
    background:rgba(255,255,255,.04);
    color:#aeb8e8;
    font-size:12px;
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    width:auto;
    box-shadow:none;
    letter-spacing:normal;
    line-height:1.4;
    transition:.2s;
}
.block-tab:hover{
    background:rgba(255,255,255,.08);
    transform:none;
    box-shadow:none;
    filter:none;
}
.block-tab.active{
    background:linear-gradient(135deg, #3d6cff, #6b5cff);
    color:#fff;
}
.block-actions{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
    flex-shrink:0;
}
.block-status{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
}
.block-status.aktif{ color:#00ffaa; background:rgba(0,255,170,.1); }
.block-status.blocked{ color:#ff4d4d; background:rgba(255,77,77,.12); }
.block-btn{
    border:none;
    padding:8px 14px;
    border-radius:12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
    white-space:nowrap;
    width:auto;
}
.block-btn.do-block{ background:#ff4d4d; color:#fff; }
.block-btn.do-unblock{ background:#00ffaa; color:#0a0e1a; }
.block-empty{
    text-align:center;
    color:#7a84ad;
    font-size:13px;
    padding:20px 0;
}
.modal-input{
    width:100%;
    padding:13px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
    color:#fff;
    font-size:14px;
    margin-bottom:18px;
    box-sizing:border-box;
    outline:none;
    text-align:left;
}
.modal-input::placeholder{ color:#7a84ad; }
.modal-btn-row{
    display:flex;
    gap:10px;
}
.modal-btn-row .modal-btn{
    width:100%;
}
.modal-btn.secondary{
    background:rgba(255,255,255,.06);
    color:#aeb8e8;
}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="firebase-config.js"></script>

</head>

<body>

<div class="sidebar" id="sidebar"></div>
<script src="Akun.js"></script>
<script src="sidebar.js"></script>

<div class="topbar">

<div
class="menu-btn"
onclick="toggleMenu()">

☰

</div>

</div>

<div
class="overlay"
id="overlay"
onclick="toggleMenu()">
</div>

<div class="block-page">

<div class="block-card">

<div class="block-card-icon">🚫</div>

<div class="block-card-title">
Blokir Akun
</div>

<div class="block-card-desc">
Cari akun berdasarkan username / email / no HP, lalu blokir atau buka blokir.
</div>

<input
type="text"
id="blockSearch"
class="block-search"
placeholder="Cari username, email, atau nomor HP...">

<div class="block-tabs">
<button class="block-tab active" id="tabSemua" onclick="setBlockFilter('semua')">Semua</button>
<button class="block-tab" id="tabAktif" onclick="setBlockFilter('aktif')">Aktif</button>
<button class="block-tab" id="tabBlokir" onclick="setBlockFilter('blokir')">Diblokir</button>
<button class="block-tab" id="tabManual" onclick="setBlockFilter('manual')">Login Manual</button>
</div>

<div id="blockCount" class="block-count">Memuat data akun...</div>

<div id="blockList" class="block-list">
<div class="block-empty">Memuat data akun...</div>
</div>

</div>

</div>

<div class="modal-overlay" id="popupModal">

<div class="modal-card">

<div class="modal-icon">
✅
</div>

<div
class="modal-title"
id="popupTitle">

Berhasil

</div>

<div
class="modal-text"
id="popupText">

Berhasil

</div>

<button
class="modal-btn"
onclick="closePopup()">

OKE

</button>

</div>

</div>

<div class="modal-overlay" id="phoneModal">

<div class="modal-card">

<div class="modal-icon">📱</div>

<div class="modal-title">Ubah Nomor HP</div>

<div class="modal-text" id="phoneModalName">Masukkan nomor HP baru.</div>

<input
type="text"
id="phoneModalInput"
class="modal-input"
placeholder="Contoh: 6281234567890">

<div class="modal-btn-row">
<button class="modal-btn secondary" onclick="closePhoneModal()">Batal</button>
<button class="modal-btn" onclick="simpanNomorAkun()">Simpan</button>
</div>

</div>

</div>

<div class="modal-overlay" id="passwordModal">

<div class="modal-card">

<div class="modal-icon">🔑</div>

<div class="modal-title">Ubah Password</div>

<div class="modal-text" id="passwordModalName">Masukkan password baru.</div>

<input
type="text"
id="passwordModalInput"
class="modal-input"
placeholder="Password baru">

<div class="modal-btn-row">
<button class="modal-btn secondary" onclick="closePasswordModal()">Batal</button>
<button class="modal-btn" onclick="simpanPasswordAkun()">Simpan</button>
</div>

</div>

</div>

<div class="modal-overlay" id="blockModal">

<div class="modal-card">

<div class="modal-icon">🚫</div>

<div class="modal-title">Blokir Akun</div>

<div class="modal-text" id="blockModalName">Berikan alasan blokir (opsional).</div>

<input
type="text"
id="blockModalInput"
class="modal-input"
placeholder="Alasan blokir (opsional)">

<div class="modal-btn-row">
<button class="modal-btn secondary" onclick="closeBlockModal()">Batal</button>
<button class="modal-btn" onclick="konfirmasiBlokirAkun()">Blokir</button>
</div>

</div>

</div>

<script>

if (localStorage.getItem("isOwner") !== "true") {
    location.href = "/"
}

function toggleMenu(){

const sidebar =
document.getElementById("sidebar")

const overlay =
document.getElementById("overlay")

sidebar.classList.toggle("active")

overlay.classList.toggle("active")

document.body.classList.toggle("sidebar-open")

}

function showPopup(title,text){

document.getElementById("popupTitle").innerText = title

document.getElementById("popupText").innerText = text

document
.getElementById("popupModal")
.classList.add("active")

}

function closePopup(){

document
.getElementById("popupModal")
.classList.remove("active")

}

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG_AUTH)
}

const db =
firebase.database()


const usersRef = db.ref("users")
const manualUsersRef = db.ref("manual_users")
const blockedUsersRef = db.ref("blocked_users")

let daftarAkun = {}     // uid -> {uid, username, email, phone, photo, password}
let daftarBlokir = {}   // uid -> {blocked, reason}
let blockSearchQuery = ""
let blockFilter = "semua" // semua | aktif | blokir

function setBlockFilter(filter){
    blockFilter = filter
    document.getElementById("tabSemua").classList.toggle("active", filter === "semua")
    document.getElementById("tabAktif").classList.toggle("active", filter === "aktif")
    document.getElementById("tabBlokir").classList.toggle("active", filter === "blokir")
    document.getElementById("tabManual").classList.toggle("active", filter === "manual")
    renderBlockList()
}

async function hashSHA256(teks){
    const enc = new TextEncoder().encode(teks)
    const buf = await crypto.subtle.digest("SHA-256", enc)
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("")
}

function getOwnerUid(){
    try{
        const stored = localStorage.getItem("danzclean_logged_user")
        if(!stored) return null
        const data = JSON.parse(stored)
        return data && data.uid ? data.uid : null
    }catch(e){
        return null
    }
}

const ownerUid = getOwnerUid()

function inisialAvatar(nama){
    if(!nama) return "?"
    return nama.trim().charAt(0).toUpperCase()
}

function renderBlockList(){

    const container = document.getElementById("blockList")
    const countEl = document.getElementById("blockCount")
    const q = blockSearchQuery.trim().toLowerCase()

    const daftar = Object.values(daftarAkun).filter(akun => {
        if(ownerUid && akun.uid === ownerUid) return false

        const statusBlokir = !!(daftarBlokir[akun.uid] && daftarBlokir[akun.uid].blocked)
        if(blockFilter === "aktif" && statusBlokir) return false
        if(blockFilter === "blokir" && !statusBlokir) return false
        if(blockFilter === "manual" && akun.sumberAkun !== "manual") return false

        if(!q) return true
        return (
            (akun.username || "").toLowerCase().includes(q) ||
            (akun.email || "").toLowerCase().includes(q) ||
            (akun.phone || "").toLowerCase().includes(q)
        )
    }).sort((a,b) => (a.username || "").localeCompare(b.username || ""))

    const totalAkun = Object.keys(daftarAkun).filter(uid => !(ownerUid && uid === ownerUid)).length
    const totalBlokir = Object.values(daftarBlokir).filter(b => b && b.blocked).length
    const totalManual = Object.values(daftarAkun).filter(akun => !(ownerUid && akun.uid === ownerUid) && akun.sumberAkun === "manual").length
    countEl.innerText = `${totalAkun} akun terdaftar · ${totalBlokir} diblokir · ${totalManual} login manual`

    if(daftar.length === 0){
        container.innerHTML = `<div class="block-empty">Tidak ada akun ditemukan.</div>`
        return
    }

    container.innerHTML = daftar.map(akun => {

        const statusBlokir = daftarBlokir[akun.uid] && daftarBlokir[akun.uid].blocked
        const infoBlokir = daftarBlokir[akun.uid]
        const avatarHtml = akun.photo
            ? `<img src="${akun.photo}">`
            : inisialAvatar(akun.username)

        const punyaPassword = !!akun.passwordHash

        const alasanBlokir = statusBlokir && infoBlokir && infoBlokir.reason
            ? `<div class="block-meta">Alasan: ${infoBlokir.reason}</div>`
            : ""

        return `
        <div class="block-row">
            <div class="block-avatar">${avatarHtml}</div>
            <div class="block-info">
                <div class="block-username">${akun.username || "(tanpa username)"} ${akun.sumberAkun === "manual" ? '<span style="font-size:10px;color:#73a5ff;background:rgba(76,125,255,.15);padding:2px 7px;border-radius:10px;margin-left:4px;font-weight:700;">MANUAL</span>' : ""}</div>
                <div class="block-meta">${akun.email || ""}</div>
                <div class="block-phone">
                    <span class="block-phone-text">${akun.phone || "(tidak ada nomor)"}</span>
                    <button class="block-edit-phone" onclick="editNomorAkun('${akun.uid}')">✏️ Ubah</button>
                </div>
                <div class="block-password">
                    <span class="block-password-text">${punyaPassword ? "Password: terenkripsi" : "(belum punya password)"}</span>
                    <button class="block-edit-password" onclick="editPasswordAkun('${akun.uid}')">✏️ Ubah</button>
                </div>
                ${alasanBlokir}
            </div>
            <div class="block-actions">
                <span class="block-status ${statusBlokir ? "blocked" : "aktif"}">
                    ${statusBlokir ? "DIBLOKIR" : "AKTIF"}
                </span>
                <button
                    class="block-btn ${statusBlokir ? "do-unblock" : "do-block"}"
                    onclick="toggleBlokirAkun('${akun.uid}', ${statusBlokir ? "false" : "true"})">
                    ${statusBlokir ? "Buka" : "Blokir"}
                </button>
            </div>
        </div>
        `
    }).join("")
}

let pendingBlockUid = null

function toggleBlokirAkun(uid, blockedBaru){

    const akun = daftarAkun[uid]

    if(blockedBaru){
        pendingBlockUid = uid
        document.getElementById("blockModalName").innerText =
            `Berikan alasan blokir untuk "${akun ? akun.username : uid}" (opsional).`
        document.getElementById("blockModalInput").value = ""
        document.getElementById("blockModal").classList.add("active")
    }else{
        blockedUsersRef.child(uid).remove().then(() => {
            showPopup("Berhasil", `Akun "${akun ? akun.username : uid}" berhasil dibuka blokirnya ✅`)
        })
    }
}

function closeBlockModal(){
    document.getElementById("blockModal").classList.remove("active")
    pendingBlockUid = null
}

function konfirmasiBlokirAkun(){

    if(!pendingBlockUid) return

    const uid = pendingBlockUid
    const akun = daftarAkun[uid]
    const reason = document.getElementById("blockModalInput").value.trim()

    blockedUsersRef.child(uid).set({
        blocked: true,
        reason: reason,
        username: akun ? akun.username : "",
        blockedAt: Date.now()
    }).then(() => {
        closeBlockModal()
        showPopup("Berhasil", `Akun "${akun ? akun.username : uid}" berhasil diblokir 🚫`)
    })
}

let pendingPhoneUid = null

function editNomorAkun(uid){

    const akun = daftarAkun[uid]
    pendingPhoneUid = uid

    document.getElementById("phoneModalName").innerText =
        `Masukkan nomor HP baru untuk "${akun ? akun.username : uid}".`
    document.getElementById("phoneModalInput").value = akun && akun.phone ? akun.phone : ""
    document.getElementById("phoneModal").classList.add("active")
}

function closePhoneModal(){
    document.getElementById("phoneModal").classList.remove("active")
    pendingPhoneUid = null
}

function simpanNomorAkun(){

    if(!pendingPhoneUid) return

    const uid = pendingPhoneUid
    const akun = daftarAkun[uid]
    const nomorTrim = document.getElementById("phoneModalInput").value.trim()

    usersRef.child(uid).once("value").then(snap => {
        if(snap.exists()){
            return usersRef.child(uid).update({ phone: nomorTrim })
        }
        return manualUsersRef.child(uid).once("value").then(snap2 => {
            if(snap2.exists()){
                return manualUsersRef.child(uid).update({ phone: nomorTrim })
            }
            return manualUsersRef.child(uid).update({ phone: nomorTrim, username: akun ? akun.username : "" })
        })
    }).then(() => {
        closePhoneModal()
        showPopup("Berhasil", `Nomor HP akun "${akun ? akun.username : uid}" berhasil diubah ✅`)
    }).catch(() => {
        showPopup("Gagal", "Terjadi kesalahan saat mengubah nomor HP.")
    })
}

let pendingPasswordUid = null

function editPasswordAkun(uid){

    const akun = daftarAkun[uid]
    pendingPasswordUid = uid

    document.getElementById("passwordModalName").innerText =
        `Masukkan password baru untuk "${akun ? akun.username : uid}".`
    document.getElementById("passwordModalInput").value = ""
    document.getElementById("passwordModal").classList.add("active")
}

function closePasswordModal(){
    document.getElementById("passwordModal").classList.remove("active")
    pendingPasswordUid = null
}

async function simpanPasswordAkun(){

    if(!pendingPasswordUid) return

    const uid = pendingPasswordUid
    const akun = daftarAkun[uid]
    const passwordBaru = document.getElementById("passwordModalInput").value.trim()

    if(!passwordBaru){
        showPopup("Gagal", "Password tidak boleh kosong.")
        return
    }

    const hashBaru = await hashSHA256(passwordBaru)

    usersRef.child(uid).once("value").then(snap => {
        if(snap.exists()){
            return usersRef.child(uid).update({ passwordHash: hashBaru })
        }
        return manualUsersRef.child(uid).once("value").then(snap2 => {
            if(snap2.exists()){
                return manualUsersRef.child(uid).update({ passwordHash: hashBaru })
            }
            return manualUsersRef.child(uid).update({ passwordHash: hashBaru, username: akun ? akun.username : "" })
        })
    }).then(() => {
        closePasswordModal()
        showPopup("Berhasil", `Password akun "${akun ? akun.username : uid}" berhasil diubah ✅`)
    }).catch(() => {
        showPopup("Gagal", "Terjadi kesalahan saat mengubah password.")
    })
}

document.getElementById("blockSearch").addEventListener("input", (e) => {
    blockSearchQuery = e.target.value
    renderBlockList()
})

usersRef.on("value", snap => {
    const data = snap.val() || {}
    Object.keys(data).forEach(uid => {
        daftarAkun[uid] = { uid, ...data[uid], sumberAkun: "auth" }
    })
    renderBlockList()
})

manualUsersRef.on("value", snap => {
    const data = snap.val() || {}
    Object.keys(data).forEach(uid => {
        daftarAkun[uid] = { uid, ...data[uid], sumberAkun: "manual" }
    })
    renderBlockList()
})

blockedUsersRef.on("value", snap => {
    daftarBlokir = snap.val() || {}
    renderBlockList()
})

</script>

</body>
</html>
