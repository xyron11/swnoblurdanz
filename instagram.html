<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Downloader - DanzClean</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="topbar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </div>
<div class="sidebar" id="sidebar"></div>
<script src="sidebar.js"></script>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="container" style="padding: 20px; max-width: 600px; margin: 70px auto 0 auto;">
        <div style="text-align: center;">
            <h2 style="color: #fff; font-size: 22px; margin-bottom: 20px;">Instagram Downloader</h2>
            
            <input type="text" id="igUrlInput" placeholder="Masukkan Link Instagram..." style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #0c102b; color: #fff; margin-bottom: 15px; box-sizing: border-box; font-size: 14px;">
            
            <button onclick="processInstagramDownload()" style="width: 100%; padding: 14px; border-radius: 12px; border: none; background: #00e676; color: #000; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 0 15px rgba(0,230,118,0.4);">
                CARI MEDIA
            </button>
            
            <div id="igResult" style="margin-top: 25px;"></div>
        </div>
    </div>

    <div class="custom-popup" id="customPopup">
        <div class="custom-popup-card">
            <div class="custom-popup-text" id="customPopupText"></div>
            <button class="custom-popup-btn" onclick="closeCustomPopup()">OK</button>
        </div>
    </div>

    <script>
        function showCustomPopup(message) {
            document.getElementById("customPopupText").innerText = message;
            document.getElementById("customPopup").classList.add("show");
        }

        function closeCustomPopup() {
            document.getElementById("customPopup").classList.remove("show");
        }
        function toggleMenu(){
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function extractFilename(url) {
            try {
                return new URL(url).searchParams.get('n') || 'danzclean_file';
            } catch {
                return 'danzclean_file';
            }
        }

        
        function forceDownload(fileUrl, fileName, btnElement) {
            if (!fileName) fileName = extractFilename(fileUrl);
            const originalText = btnElement.innerText;
            btnElement.innerText = "Membuka unduhan...";
            btnElement.style.opacity = "0.7";

            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = fileUrl;
            a.download = fileName;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                btnElement.innerText = originalText;
                btnElement.style.opacity = "1";
            }, 1200);
        }

        function isValidInstagramUrl(url) {
            return /instagram\.com/i.test(url);
        }

        async function processInstagramDownload() {
            const url = document.getElementById("igUrlInput").value.trim();
            const resultDiv = document.getElementById("igResult");

            if (!url) {
                alert("Masukkan URL Instagram terlebih dahulu!");
                return;
            }

            if (!isValidInstagramUrl(url)) {
                showCustomPopup("Itu bukan link Instagram!");
                return;
            }

            resultDiv.innerHTML = '<p style="color: #aaa; text-align: center;">Mengambil data media...</p>';

            try {
                const targetApi = `${DOWNLOAD_API}/api/instagram?url=${encodeURIComponent(url)}`;
                const response = await fetch(targetApi);
                const data = await response.json();

                if (!data.status || !data.result) {
                    resultDiv.innerHTML = `<p style="color: #ff5252; text-align: center;">Gagal mengambil data dari URL tersebut.<br><span style="font-size:11px; opacity:0.8;">${data.error || data.message || ''}</span></p>`;
                    return;
                }

                const res = data.result;
                let mediaHtml = '';

                if (res.type === 'video' || (res.url && res.url.includes('.mp4'))) {
                    mediaHtml = `
                        <video src="${res.url}" controls style="width:100%; border-radius:12px; max-height:350px; margin-bottom:12px;"></video>
                        <button onclick="forceDownload('${res.url}', null, this)" style="width:100%; background:#00e676; color:#000; padding:12px; border-radius:10px; border:none; font-weight:bold; cursor:pointer;">DOWNLOAD VIDEO</button>
                    `;
                } else {
                    mediaHtml = `
                        <img src="${res.url}" style="width:100%; border-radius:12px; max-height:350px; object-fit:contain; margin-bottom:12px;">
                        <button onclick="forceDownload('${res.url}', null, this)" style="width:100%; background:#00e676; color:#000; padding:12px; border-radius:10px; border:none; font-weight:bold; cursor:pointer;">DOWNLOAD FOTO</button>
                    `;
                }

                resultDiv.innerHTML = `
                    <div style="background: rgba(12, 16, 43, 0.9); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 16px; text-align: center;">
                        <p style="color: #00e676; font-weight: bold; margin-bottom: 8px;">@${res.username || 'instagram_user'}</p>
                        ${res.caption ? `<p style="color: #ccc; font-size: 12px; margin-bottom: 12px; max-height: 80px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; white-space: pre-line;">${res.caption}</p>` : ''}
                        ${mediaHtml}
                    </div>
                `;
            } catch (e) {
                console.error(e);
                resultDiv.innerHTML = `<p style="color: #ff5252; text-align: center;">Terjadi kesalahan koneksi.<br><span style="font-size:11px; opacity:0.8;">${e.message}</span></p>`;
            }
        }
    </script>
</body>
</html>
