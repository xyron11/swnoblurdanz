<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Perbaikan danzclean</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="firebase-config.js"></script>

</head>

<body>

<div class="sidebar" id="sidebar"></div>
<script src="akun.js"></script>
<script src="sidebar.js"></script>

<div class="topbar">

<div
class="menu-btn"
onclick="toggleMenu()">

☰

</div>

</div>

<div
class="overlay"
id="overlay"
onclick="toggleMenu()">
</div>

<div class="maintenance-page">

<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>

<div class="maintenance-card">

<div class="icon">
🛠️
</div>

<div class="maintenance-title">
Perbaikan<br>Danzclean
</div>

<div class="desc">
perbaikan untuk danzclean
</div>

<input
type="file"
id="imageFile"
accept="image/*"
style="display:none;">

<label
for="imageFile"
class="upload-image-btn">

 Upload Foto

</label>

<img
id="previewImage"
class="preview-image"
style="display:none;">

<textarea
id="message"
class="maintenance-input"
placeholder="Tulis pesan maintenance..."
></textarea>

<div
id="status"
class="maintenance-status">

Status: NONAKTIF

</div>

<div class="maintenance-buttons">

<button
class="btn-active"
onclick="enableMaintenance()">

AKTIFKAN

</button>

<button
class="btn-disable"
onclick="disableMaintenance()">

NONAKTIFKAN

</button>

</div>

</div>

<div class="modal-overlay" id="popupModal">

<div class="modal-card">

<div class="modal-icon">
✅
</div>

<div
class="modal-title"
id="popupTitle">

Berhasil

</div>

<div
class="modal-text"
id="popupText">

Maintenance berhasil diaktifkan

</div>

<button
class="modal-btn"
onclick="closePopup()">

OKE

</button>

</div>

</div>

<script>

// Hanya akun yang terdaftar di akun.js yang boleh buka halaman ini
if (localStorage.getItem("isOwner") !== "true") {
    location.href = "/"
}

function toggleMenu(){

const sidebar =
document.getElementById("sidebar")

const overlay =
document.getElementById("overlay")

sidebar.classList.toggle("active")

overlay.classList.toggle("active")

document.body.classList.toggle("sidebar-open")

}

function showPopup(title,text){

document.getElementById("popupTitle").innerText = title

document.getElementById("popupText").innerText = text

document
.getElementById("popupModal")
.classList.add("active")

}

function closePopup(){

document
.getElementById("popupModal")
.classList.remove("active")

}

firebase.initializeApp(FIREBASE_CONFIG_AUTH)

const db =
firebase.database()

const maintenanceRef =
db.ref("maintenance")

let selectedImage = ""

document
.getElementById("imageFile")
.addEventListener("change", function(e){

const file = e.target.files[0]

if(!file) return

const reader = new FileReader()

reader.onload = function(ev){

selectedImage = ev.target.result

const preview =
document.getElementById("previewImage")

preview.src = selectedImage

preview.style.display = "block"

}

reader.readAsDataURL(file)

})

function enableMaintenance(){

const message =
document
.getElementById("message")
.value
.trim()

maintenanceRef.set({

enabled:true,

message:
message ||
"Website sedang diperbaiki",

image:
selectedImage || ""

}).then(() => {

showPopup(
"Berhasil",
"Maintenance berhasil diaktifkan ✅"
)

document.getElementById("message").value = ""

selectedImage = ""

const preview =
document.getElementById("previewImage")

preview.style.display = "none"

preview.src = ""

document.getElementById("imageFile").value = ""

})

}

function disableMaintenance(){

maintenanceRef.set({

enabled:false,

message:"",
image:""

}).then(() => {

showPopup(
"Berhasil",
"Maintenance berhasil dinonaktifkan ❌"
)

})

selectedImage = ""

document.getElementById("previewImage").style.display = "none"

document.getElementById("imageFile").value = ""

}

maintenanceRef.on("value", snap => {

const data =
snap.val()

const status =
document.getElementById("status")

const input =
document.getElementById("message")

const preview =
document.getElementById("previewImage")

if(data){

input.value = data.message || ""

if(data.image){

selectedImage = data.image

preview.src = data.image

preview.style.display = "block"

}else{

preview.style.display = "none"

}

if(data.enabled){

status.innerHTML =
"Status: AKTIF"

}else{

status.innerHTML =
"Status: NONAKTIF"

}

}

})

</script>

</body>
</html>
